# Minimal local backend for testing auth + row-level security (about 100 MB of images).
# Not the full Supabase stack: no Storage or Realtime. `npm run backend:up` then `npm run test:backend`.
name: portfolio-local

x-jwt: &jwt "super-secret-jwt-token-with-at-least-32-characters-long"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["54322:5432"]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:4173
      GOTRUE_JWT_SECRET: *jwt
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@local.test
      GOTRUE_SMTP_SENDER_NAME: Portfolio
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway/templates/code.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://gateway/templates/code.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Your sign-in code
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your sign-in code
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "false"
      GOTRUE_MFA_ENABLED: "true"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: "10"

  rest:
    image: postgrest/postgrest:latest
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt

  mail:
    image: axllent/mailpit:v1.31
    ports: ["54324:8025"]

  gateway:
    image: nginx:alpine
    depends_on: [auth, rest]
    ports: ["54321:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./templates:/usr/share/nginx/html/templates:ro
