# Cloudflare Workers config: one free deployment serves the site (static assets) and the API (/api/*).
# Setup steps are in README.md. Secrets (APP_SECRET, OWNER_EMAIL, BREVO_API_KEY, MAIL_FROM) are set with
# `wrangler secret put` and never live in this file.
name = "portfolio"
main = "server/src/worker.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "portfolio"
# Replace with the id printed by: npx wrangler d1 create portfolio
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# Browser origins allowed to call the API cross-site, for example a GitHub Pages copy of the site.
ALLOWED_ORIGINS = "https://jhjh1214.github.io"
